name: Java CI/CD Pipeline with Maven and Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Source Code
      uses: actions/checkout@v4

    - name: 2. Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: 3. Build & Compile with Maven
      run: mvn -B clean compile --file pom.xml

    - name: 4. Run Automated JUnit Unit Tests
      run: mvn -B test --file pom.xml

    - name: 5. Package Application JAR
      run: mvn -B package -DskipTests --file pom.xml

    - name: 6. Build Docker Container Image
      run: docker build -t student-management-app:latest .

    - name: 7. Verify Built Artifacts
      run: |
        ls -la target/*.jar
        docker images | grep student-management-app

