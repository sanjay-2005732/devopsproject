# ============================================
# APPLICATION PROPERTIES - Development Profile
# ============================================

# Server Configuration
server.port=${APP_PORT:8080}
spring.application.name=student-management-app

# ============================================
# H2 Database (Default - Local Development)
# ============================================
spring.datasource.url=jdbc:h2:mem:studentdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================
# JPA / Hibernate
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# Actuator (Health Checks)
# ============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=Student Management Application
info.app.description=CI/CD Pipeline Demo Application
info.app.version=1.0.0

# ============================================
# Logging
# ============================================
logging.level.com.devops.studentapp=DEBUG
logging.level.org.springframework.web=INFO

