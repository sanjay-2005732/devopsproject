# ============================================
# DOCKER COMPOSE - Local Development Stack
# Student Management Application
# ============================================
# Usage:
#   docker-compose up --build        (H2 in-memory DB)
#   docker-compose --profile mysql up --build  (MySQL DB)
# ============================================

version: '3.8'

services:
  # ---- Student Management App ----
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-management-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - APP_PORT=8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - app-network

  # ---- MySQL Database (Optional - use with --profile mysql) ----
  mysql:
    image: mysql:8.0
    container_name: student-db
    profiles:
      - mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-studentdb}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ---- App with MySQL (Optional - use with --profile mysql) ----
  app-mysql:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-app-mysql
    profiles:
      - mysql
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-studentdb}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-rootpassword}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # ---- Jenkins CI/CD (Optional - use with --profile cicd) ----
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins-server
    profiles:
      - cicd
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true
    restart: unless-stopped
    networks:
      - app-network

volumes:
  mysql-data:
    driver: local
  jenkins-data:
    driver: local

networks:
  app-network:
    driver: bridge

